name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topdownnotifications16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
      - name: Build rootless package
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1
      - name: Validate package and architectures
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "${debs[0]}" Package)" = com.551.topdownnotifications16
          dpkg-deb --info "${debs[0]}"
          dpkg-deb --contents "${debs[0]}"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/topdown-check"
          binary="$RUNNER_TEMP/topdown-check/var/jb/Library/MobileSubstrate/DynamicLibraries/TopDownNotifications16.dylib"
          test -s "$binary"
          xcrun lipo "$binary" -verify_arch arm64 arm64e
          xcrun otool -L "$binary"
          plutil -lint "$RUNNER_TEMP/topdown-check/var/jb/Library/MobileSubstrate/DynamicLibraries/TopDownNotifications16.plist"
          prefs="$RUNNER_TEMP/topdown-check/var/jb/Library/PreferenceBundles/TopDownNotifications16Prefs.bundle"
          xcrun lipo "$prefs/TopDownNotifications16Prefs" -verify_arch arm64 arm64e
          plutil -lint "$prefs/Info.plist"
          entries="$RUNNER_TEMP/topdown-check/var/jb/Library/PreferenceLoader/Preferences"
          plutil -lint "$entries/TopDownNotifications16.plist"
          for suffix in '' '@2x' '@3x'; do
            test -s "$prefs/icon${suffix}.png"
            test -s "$entries/TopDownNotifications16${suffix}.png"
            sips -g pixelWidth -g pixelHeight "$entries/TopDownNotifications16${suffix}.png"
          done
      - name: Verify Settings screen in Simulator
        run: bash tests/settings-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Settings-UI-check
          path: |
            build/settings-preview.png
            build/settings-smoke.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TopDownNotifications16-rootless
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          gh release create "v${version}" packages/*.deb \
            --target "$GITHUB_SHA" --title "TopDownNotifications16 ${version}" \
            --notes ""
